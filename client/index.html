<!doctype html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Chalet Beyond — Vysoké Tatry</title>
    <meta name="description" content="Súkromný chalet v srdci Vysokých Tatier. Výhľad na Lomničák, golfové ihrisko Black Stork, sauna, vírivka. Beyond your expectations." />
    <!-- hreflang: tells search engines these four pages are the same content in
         different languages, so they rank the right one per market instead of
         treating them as duplicates. x-default points at the Slovak root. -->
    <link rel="alternate" hreflang="sk" href="https://chaletbeyond.sk/" />
    <link rel="alternate" hreflang="de" href="https://chaletbeyond.sk/de" />
    <link rel="alternate" hreflang="en" href="https://chaletbeyond.sk/en" />
    <link rel="alternate" hreflang="pl" href="https://chaletbeyond.sk/pl" />
    <link rel="alternate" hreflang="x-default" href="https://chaletbeyond.sk/" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Karla:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="module">
      // Vite substitutes import.meta.env inside a module script. The %VAR% form
      // is only replaced when the variable is defined, so an unset one shipped
      // the literal "%VITE_ANALYTICS_ENDPOINT%/umami" as a URL — which recorded
      // nothing and crashed `netlify dev` with "URI malformed" on every load.
      const endpoint = import.meta.env.VITE_ANALYTICS_ENDPOINT;
      const websiteId = import.meta.env.VITE_ANALYTICS_WEBSITE_ID;
      if (endpoint && websiteId) {
        const tag = document.createElement("script");
        tag.defer = true;
        tag.src = `${endpoint}/umami`;
        tag.dataset.websiteId = websiteId;
        document.head.appendChild(tag);
      }
    </script>
  </body>
</html>
