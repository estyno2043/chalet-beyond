[build]
  command = "pnpm build"
  publish = "dist/public"

[dev]
  command = "pnpm dev"
  targetPort = 3000
  port = 8888

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "10"

# Long-cache fingerprinted assets — Vite already hashes them.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Videos: allow Range requests (HTML5 video scrubbing) and a sensible cache.
[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
    Accept-Ranges = "bytes"

# Hero files include a version in their name; a new edit uses a new URL.
[[headers]]
  for = "/media/hero/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SPA fallback — wouter handles client-side routes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
